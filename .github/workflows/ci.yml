# File: .github/workflows/ci.yml
# Purpose: CI — install, generate Prisma client, build all workspaces, unit tests

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge-ai-workspace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: forge-ai-workspace/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: forge-ai-workspace/apps/backend

      - name: Build all workspaces
        run: npm run build

      - name: Backend unit tests
        run: npx jest --testPathPattern=tests/unit --ci
        working-directory: forge-ai-workspace/apps/backend
